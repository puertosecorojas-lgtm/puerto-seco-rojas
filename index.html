<!DOCTYPE html>
<html lang="es">
<head>

<title>Puerto Seco Rojas â€” CRM Comercial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--sidebar:#161b27;--card:#1e2436;--border:#2a3050;
  --accent:#3b82f6;--accent2:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --text:#e2e8f0;--muted:#8892aa;--white:#fff;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;min-width:220px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.logo{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.logo h1{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.5px;line-height:1.3}
.logo p{font-size:11px;color:var(--muted);margin-top:2px}
#connection-badge{margin:8px 16px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;text-align:center;background:#1a2a1a;color:#4ade80;border:1px solid #2d5a2d}
#connection-badge.off{background:#2a1a1a;color:#f87171;border-color:#5a2d2d}
#gmail-badge{margin:4px 16px 0;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;text-align:center;background:#1a1a2a;color:#8892aa;border:1px solid #2a3050;cursor:pointer}
#notif-badge{margin:4px 16px 0;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;text-align:center;background:#1a2a1a;color:#4ade80;border:1px solid #2d5a2d;cursor:pointer}
nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(59,130,246,.08);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent);border-left-color:var(--accent)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--sidebar)}
.topbar-title{font-size:16px;font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:20px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-card .val{font-size:28px;font-weight:700;color:var(--white)}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:4px}
.stat-card .sub{font-size:12px;color:var(--accent2);margin-top:6px}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-toolbar{padding:12px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(42,48,80,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(59,130,246,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:#93c5fd}
.badge-green{background:rgba(16,185,129,.2);color:#6ee7b7}
.badge-amber{background:rgba(245,158,11,.2);color:#fcd34d}
.badge-red{background:rgba(239,68,68,.2);color:#fca5a5}
.badge-gray{background:rgba(100,116,139,.2);color:#94a3b8}
.badge-purple{background:rgba(139,92,246,.2);color:#c4b5fd}
.form-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.form-section h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#111827}
textarea{resize:vertical;min-height:80px}
select option{background:#1e2436}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-success{background:var(--accent2);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.enfoque-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.enfoque-item{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:.15s;display:flex;gap:8px;align-items:flex-start}
.enfoque-item:hover{border-color:var(--accent)}
.enfoque-item.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.enfoque-item input[type=checkbox]{width:14px;height:14px;margin-top:1px;flex-shrink:0;accent-color:var(--accent)}
.enfoque-item span{font-size:12px;line-height:1.4;color:var(--text)}
#email-preview-box{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:300px;overflow-y:auto}
#email-preview-box.empty{color:var(--muted);font-style:italic}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:420px;max-width:600px;width:90%}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.lead-result{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lead-result-info{flex:1}
.lead-result-info strong{font-size:13px;display:block;margin-bottom:2px}
.lead-result-info span{font-size:12px;color:var(--muted)}
.lead-result-actions{display:flex;gap:6px;flex-shrink:0}
.email-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.email-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.email-item-body{font-size:12px;color:var(--muted);line-height:1.5;max-height:60px;overflow:hidden}
.status-sin_contactar{color:var(--muted)}
.status-contactado{color:#93c5fd}
.status-interesado{color:#6ee7b7}
.status-reunion_agendada{color:#c4b5fd}
.status-no_interesado{color:#fca5a5}
.status-sin_respuesta{color:#fcd34d}
.inner-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.inner-tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.inner-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;pointer-events:auto;animation:fadeIn .2s ease}
.toast-item.ok{border-left:3px solid var(--accent2)}
.toast-item.err{border-left:3px solid var(--danger)}
.toast-item.warn{border-left:3px solid var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.flex{display:flex}
.gap-2{gap:8px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.text-muted{color:var(--muted)}
.text-sm{font-size:12px}
.w-full{width:100%}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:340px;text-align:center}
.login-box h2{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:6px}
.login-box p{font-size:12px;color:var(--muted);margin-bottom:24px}
.login-box input{margin-bottom:12px;text-align:left}
.login-error{color:var(--danger);font-size:12px;margin-top:8px;min-height:18px}
</style>

<body>

<script>
let DB = { url: '', key: '' };
let CFG = {};
let allLeads = [];
let allEnviados = [];
let currentLead = null;
let emailBody = '';

function parseApiError(err, service) {
  const msg = (err?.message || err?.error?.message || String(err)).toLowerCase();
  if (service === 'groq' || msg.includes('groq')) {
    if (msg.includes('rate_limit') || msg.includes('rate limit') || msg.includes('tokens per minute'))
      return 'Groq: limite de velocidad alcanzado. Espera 60 segundos e intenta de nuevo.';
    if (msg.includes('insufficient_quota') || msg.includes('quota') || msg.includes('billing'))
      return 'Groq: se agotaron los tokens del plan gratuito. Revisa console.groq.com';
    if (msg.includes('invalid') && msg.includes('key'))
      return 'Groq: API key invalida. Verifica la clave en Configuracion > Keys.';
  }
  if (service === 'hunter' || msg.includes('hunter')) {
    if (msg.includes('429') || msg.includes('too many') || msg.includes('limit'))
      return 'Hunter.io: limite de busquedas alcanzado (plan gratuito: 25/mes).';
    if (msg.includes('401') || msg.includes('unauthorized') || msg.includes('invalid key'))
      return 'Hunter.io: API key invalida.';
  }
  if (service === 'apollo' || msg.includes('apollo')) {
    if (msg.includes('429') || msg.includes('rate') || msg.includes('limit'))
      return 'Apollo.io: limite de busquedas alcanzado.';
    if (msg.includes('401') || msg.includes('unauthorized') || msg.includes('invalid'))
      return 'Apollo.io: API key invalida.';
    if (msg.includes('no configurada') || msg.includes('not configured'))
      return 'Apollo.io: key no configurada. Agrega APOLLO_API_KEY en Vercel.';
  }
  if (service === 'gmail' || msg.includes('gmail') || msg.includes('smtp')) {
    if (msg.includes('invalid login') || msg.includes('username and password') || msg.includes('535'))
      return 'Gmail: contrasena de app incorrecta.';
    if (msg.includes('getaddrinfo') || msg.includes('network') || msg.includes('enotfound'))
      return 'Gmail: sin conexion de red desde el servidor.';
    if (msg.includes('550') || msg.includes('rejected'))
      return 'Gmail: el email fue rechazado por el servidor destino.';
  }
  if (service === 'supabase' || msg.includes('supabase') || msg.includes('jwt') || msg.includes('pgrst')) {
    if (msg.includes('jwt') || msg.includes('invalid key') || msg.includes('apikey'))
      return 'Supabase: clave invalida.';
    if (msg.includes('does not exist') || msg.includes('relation') || msg.includes('table'))
      return 'Supabase: tabla no encontrada. Ejecuta el schema SQL.';
    if (msg.includes('fetch') || msg.includes('network') || msg.includes('failed'))
      return 'Supabase: sin conexion.';
  }
  return 'Error: ' + (err?.message || String(err));
}

let KEYS = {};

function loadKeysFromStorage() {
  KEYS = JSON.parse(localStorage.getItem('crm_keys') || '{}');
  if (KEYS.supabaseUrl) DB.url = KEYS.supabaseUrl;
  if (KEYS.supabaseKey) DB.key = KEYS.supabaseKey;
}

function saveKeysToStorage(newKeys) {
  KEYS = { ...KEYS, ...newKeys };
  localStorage.setItem('crm_keys', JSON.stringify(KEYS));
}

function withKeys(body) {
  const k = {};
  if (KEYS.groqKey)    k._groqKey   = KEYS.groqKey;
  if (KEYS.apolloKey)  k._apolloKey = KEYS.apolloKey;
  if (KEYS.hunterKey)  k._hunterKey = KEYS.hunterKey;
  if (KEYS.apifyKey)   k._apifyKey  = KEYS.apifyKey;
  return { ...body, ...k };
}

async function apiFetch(endpoint, body) {
  const r = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(withKeys(body)),
  });
  return r.json();
}

// GMAIL SYNC
function connectGmail() {
  window.location.href = '/api/gmail-auth';
}

async function syncGmail() {
  try {
    const r = await fetch('/api/gmail-sync', { method: 'POST' });
    const d = await r.json();
    const gmailBadge = document.getElementById('gmail-badge');
    if (!d.ok) {
      if (d.error === 'Gmail no conectado') {
        if (gmailBadge) { gmailBadge.textContent = 'Gmail: no conectado - click para conectar'; gmailBadge.style.color = '#f87171'; }
      }
      return;
    }
    if (gmailBadge) { gmailBadge.textContent = 'Gmail: conectado'; gmailBadge.style.color = '#4ade80'; gmailBadge.style.borderColor = '#2d5a2d'; gmailBadge.style.background = '#1a2a1a'; }
    if (d.nuevas > 0) {
      await Promise.all([loadLeads(), loadEnviados()]);
      const nc = document.getElementById('notif-count');
      const nb = document.getElementById('notif-badge');
      if (nc) nc.textContent = d.nuevas;
      if (nb) nb.classList.remove('hidden');
      showToast(d.nuevas + ' respuesta(s) nueva(s) de leads', 'ok');
    }
  } catch(e) { console.log('Gmail sync error:', e.message); }
}

function checkGmailCallback() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('gmail_connected') === '1') {
    showToast('Gmail conectado correctamente', 'ok');
    const b = document.getElementById('gmail-badge');
    if (b) { b.textContent = 'Gmail: conectado'; b.style.color = '#4ade80'; b.style.borderColor = '#2d5a2d'; b.style.background = '#1a2a1a'; }
    window.history.replaceState({}, '', '/');
    syncGmail();
  }
  if (params.get('gmail_error')) {
    showToast('Error conectando Gmail: ' + params.get('gmail_error'), 'err');
    window.history.replaceState({}, '', '/');
  }
}


// =====================================================================
// LOGIN
// =====================================================================
function checkAuth() {
  return sessionStorage.getItem('crm_auth') === '1';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
}

async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = 'Ingresa usuario y contrasena'; return; }
  const btn = document.querySelector('#login-screen .btn');
  btn.disabled = true; btn.textContent = 'Verificando...';
  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass })
    });
    const d = await r.json();
    if (d.ok) {
      sessionStorage.setItem('crm_auth', '1');
      showApp();
    } else {
      errEl.textContent = 'Usuario o contrasena incorrectos';
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  } catch(e) {
    errEl.textContent = 'Error de conexion';
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!checkAuth()) return;
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('es-AR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  loadKeysFromStorage();
  if (!DB.url || !DB.key) {
    try {
      const r = await fetch('/api/config');
      if (r.ok) {
        const c = await r.json();
        if (!DB.url && c.supabaseUrl) DB.url = c.supabaseUrl;
        if (!DB.key && c.supabaseKey) DB.key = c.supabaseKey;
      }
    } catch(e){}
  }
  await checkConnection();
  await Promise.all([loadLeads(), loadEnviados(), loadCfg()]);
  renderPage('dashboard');
  checkGmailCallback();
  syncGmail();
  setInterval(syncGmail, 5 * 60 * 1000);
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => renderPage(el.dataset.page));
  });
});

async function checkConnection() {
  const badge = document.getElementById('connection-badge');
  if (!DB.url || !DB.key) {
    badge.textContent = 'Sin Supabase - configurar Keys';
    badge.classList.add('off');
    badge.style.cursor = 'pointer';
    badge.onclick = () => renderPage('config');
    return false;
  }
  try {
    const r = await sbFetch('configuracion?select=id&limit=1');
    if (r.ok) {
      badge.textContent = 'Conectado a Supabase';
      badge.classList.remove('off');
      badge.onclick = null;
      return true;
    }
    badge.textContent = 'Error Supabase';
    badge.classList.add('off');
    return false;
  } catch(e) {
    badge.textContent = 'Sin conexion';
    badge.classList.add('off');
    return false;
  }
}

async function sbFetch(path, options = {}) {
  if (!DB.url || !DB.key) throw new Error('Supabase no configurado');
  const url = `${DB.url}/rest/v1/${path}`;
  const opts = {
    ...options,
    headers: {
      'apikey': DB.key,
      'Authorization': `Bearer ${DB.key}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(options.headers || {}),
    },
  };
  return fetch(url, opts);
}

async function sbGet(table, query = '') {
  const r = await sbFetch(`${table}?${query}`);
  if (!r.ok) throw new Error(`Error cargando ${table}`);
  return r.json();
}

async function buscarEmailWeb(leadId, web, empresa) {
  const btn = document.getElementById('btn-scrape-' + leadId);
  if (btn) { btn.textContent = 'Buscando...'; btn.disabled = true; }
  try {
    const r = await fetch('/api/scrape-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ web, company: empresa }),
    });
    const d = await r.json();
    if (d.best) {
      await sbFetch('leads?id=eq.' + leadId, {
        method: 'PATCH',
        body: JSON.stringify({ email: d.best, email_status: 'encontrado_web' }),
      });
      await loadLeads();
      showToast('Email encontrado: ' + d.best, 'ok');
    } else {
      showToast('No se encontro email en el sitio web', 'err');
      if (btn) { btn.textContent = 'Sin email'; btn.disabled = false; }
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'err');
    if (btn) { btn.textContent = 'Reintentar'; btn.disabled = false; }
  }
}

async function sbInsert(table, data) {
  const r = await sbFetch(table, { method: 'POST', body: JSON.stringify(data) });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}

async function sbUpdate(table, id, data) {
  const r = await sbFetch(`${table}?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(data) });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}

async function sbDelete(table, id) {
  const r = await sbFetch(`${table}?id=eq.${id}`, { method: 'DELETE' });
  if (!r.ok) throw new Error('Error eliminando');
}

async function searchApify(mode) {
  const loadingEl = document.getElementById('maps-loading');
  const resultsEl = document.getElementById('maps-results');
  loadingEl.classList.remove('hidden');
  resultsEl.innerHTML = '';

  let body = {};
  if (mode === 'url') {
    const url = document.getElementById('maps-url')?.value.trim();
    if (!url) { showToast('Ingresa una URL de Google Maps', 'err'); loadingEl.classList.add('hidden'); return; }
    body = { url };
  } else {
    const query = document.getElementById('maps-query')?.value.trim();
    const city = document.getElementById('maps-city')?.value.trim();
    if (!query) { showToast('Ingresa un rubro o tipo de empresa', 'err'); loadingEl.classList.add('hidden'); return; }
    body = { searchQuery: query + (city ? ' ' + city + ' Argentina' : ' Argentina') };
  }

  if (KEYS.apifyKey) body._apifyKey = KEYS.apifyKey;

  try {
    const d = await apiFetch('/api/apify', body);
    if (d.error) throw new Error(d.error);
    const leads = d.leads || [];
    window.__apifyResults = leads;

    resultsEl.innerHTML = `
    <div class="form-section">
      <h3>${leads.length} empresa(s) encontrada(s) en Google Maps</h3>
      ${leads.length === 0 ? '<p class="text-muted text-sm">Sin resultados. Proba con otra busqueda.</p>' : ''}
      ${leads.map((l,i) => `
      <div class="lead-result">
        <div class="lead-result-info">
          <strong>${l.empresa}</strong>
          <span>${tipoBadge(l.tipo)} Â· ${l.ciudad||'â€”'}</span>
          ${l.telefono ? `<div style="font-size:12px;color:#93c5fd;margin-top:3px">${l.telefono}</div>` : ''}
          ${l.email ? `<div style="font-size:12px;color:#fcd34d">${l.email}</div>` : ''}
          ${l.web ? `<div style="font-size:11px;color:var(--muted)">${l.web}</div>` : ''}
          ${l.direccion ? `<div style="font-size:11px;color:var(--muted)">${l.direccion}</div>` : ''}
        </div>
        <div class="lead-result-actions">
          <button class="btn btn-primary btn-sm" onclick="addLeadFromApify(${i})">+ Agregar</button>
        </div>
      </div>`).join('')}
      ${leads.length > 1 ? `<button class="btn btn-primary" style="margin-top:8px" onclick="addAllFromApify()">+ Agregar todos (${leads.length})</button>` : ''}
    </div>`;
  } catch(e) {
    resultsEl.innerHTML = `<div class="form-section" style="border-color:var(--danger)"><p style="color:var(--danger)">${parseApiError(e, 'apify')}</p></div>`;
  }
  loadingEl.classList.add('hidden');
}

async function addLeadFromApify(idx) {
  const l = (window.__apifyResults||[])[idx];
  if (!l) return;
  if (l.email && allLeads.some(x => x.email === l.email)) return showToast('Ya existe un lead con ese email', 'warn');
  try {
    const res = await sbInsert('leads', l);
    allLeads.unshift(res[0]||l);
    document.getElementById('badge-leads').textContent = allLeads.length;
    showToast('Lead agregado: ' + l.empresa, 'ok');
  } catch(e) { showToast('Error: '+e.message, 'err'); }
}

async function addAllFromApify() {
  const results = window.__apifyResults || [];
  let added = 0, skipped = 0;
  for (const l of results) {
    if (l.email && allLeads.some(x => x.email === l.email)) { skipped++; continue; }
    try {
      const res = await sbInsert('leads', l);
      allLeads.unshift(res[0]||l);
      added++;
    } catch(e) { skipped++; }
  }
  document.getElementById('badge-leads').textContent = allLeads.length;
  showToast(added + ' leads agregados' + (skipped?' Â· '+skipped+' omitidos':''), 'ok');
}

async function verifyEmailLead(id, email) {
  showToast('Verificando email...', 'warn');
  try {
    const d = await apiFetch('/api/hunter', { action:'verify', email });
    if (d.error) throw new Error(d.error);
    const status = d.valid ? 'verificado' : d.status === 'invalid' ? 'invalido' : 'sin_verificar';
    await sbUpdate('leads', id, { email_status: status });
    const lead = allLeads.find(l => l.id === id);
    if (lead) lead.email_status = status;
    showToast('Email ' + status + ' â€” score ' + d.score + '/100', d.valid ? 'ok' : 'err');
    filterLeads();
  } catch(e) { showToast(parseApiError(e, 'hunter'), 'err'); }
}

async function saveLead(id) {
  const data = {
    nombre:   document.getElementById('ml-nombre').value.trim(),
    empresa:  document.getElementById('ml-empresa').value.trim(),
    tipo:     document.getElementById('ml-tipo').value,
    ciudad:   document.getElementById('ml-ciudad').value.trim(),
    zona:     document.getElementById('ml-zona').value,
    email:    document.getElementById('ml-email').value.trim().toLowerCase(),
    telefono: document.getElementById('ml-tel').value.trim(),
    web:      document.getElementById('ml-web').value.trim(),
    notas:    document.getElementById('ml-notas').value.trim(),
    fuente:   'manual',
  };
  if (!data.nombre && !data.empresa) return showToast('Ingresa nombre o empresa', 'err');
  try {
    if (id) {
      await sbUpdate('leads', id, data);
      const i = allLeads.findIndex(l => l.id === id);
      if (i >= 0) allLeads[i] = { ...allLeads[i], ...data };
      showToast('Lead actualizado', 'ok');
    } else {
      const res = await sbInsert('leads', data);
      allLeads.unshift(res[0]||data);
      document.getElementById('badge-leads').textContent = allLeads.length;
      showToast('Lead agregado', 'ok');
    }
    document.querySelector('.modal-overlay')?.remove();
    filterLeads();
  } catch(e) { showToast('Error: ' + e.message, 'err'); }
}

async function hunterVerifyAndUpdate(idx) {
  const l = (window.__apolloResults||[])[idx];
  if (!l?.email) return;
  const btn = document.getElementById(`ev-btn-${idx}`);
  const statusEl = document.getElementById(`ev-status-${idx}`);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const d = await apiFetch('/api/hunter', {action:'verify',email:l.email});
    if (d.error) throw new Error(d.error);
    const ok = d.valid;
    if (statusEl) statusEl.innerHTML = ok ? `<span style="color:#4ade80">valido (score ${d.score})</span>` : `<span style="color:#f87171">invalido (score ${d.score})</span>`;
    window.__apolloResults[idx].email_status = ok ? 'verificado' : d.status === 'invalid' ? 'invalido' : 'sin_verificar';
    if (btn) { btn.textContent = ok ? 'Valido' : 'Invalido'; }
  } catch(e) {
    if (statusEl) statusEl.textContent = '(error verificando)';
    showToast(parseApiError(e, 'hunter'), 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Verificar'; }
  }
}

async function addLeadFromApollo(idx) {
  const l = (window.__apolloResults||[])[idx];
  if (!l) return;
  if (l.email && allLeads.some(x => x.email === l.email)) return showToast('Ya existe un lead con ese email', 'warn');
  try {
    const res = await sbInsert('leads', l);
    allLeads.unshift(res[0]||l);
    document.getElementById('badge-leads').textContent = allLeads.length;
    showToast('Lead agregado: ' + (l.nombre||l.empresa), 'ok');
  } catch(e) { showToast('Error: '+e.message, 'err'); }
}

async function parsearTextoConIA() {
  const texto = document.getElementById('paste-text')?.value.trim();
  if (!texto) return showToast('Pega texto primero', 'err');
  document.getElementById('parse-loading').classList.remove('hidden');
  document.getElementById('parse-results').innerHTML = '';
  const prompt = `Analiza el siguiente texto copiado de Google Maps, LinkedIn u otras fuentes y extrae los datos de TODAS las empresas o contactos que encuentres.

Para cada empresa o contacto, extrae estos campos (deja vacio si no esta):
- nombre: nombre de la persona de contacto
- empresa: nombre de la empresa/estudio/agencia
- tipo: clasificar como: despachante | estudio_aduanero | operador_logistico | importador_exportador | agro_industrial | empresa
- ciudad: ciudad donde opera
- zona: provincia o zona
- email: direccion de email
- telefono: telefono
- web: sitio web
- notas: info adicional util

Texto a analizar:
---
${texto}
---

Responde SOLO con JSON valido: {"leads": [...]}
Si no encuentras nada: {"leads": [], "mensaje": "No se encontraron datos"}`;

  try {
    const d = await apiFetch('/api/ai', { prompt });
    if (d.error) throw new Error(d.error);
    let parsed;
    try {
      const clean = d.text.replace(/` + '```' + `json?|` + '```' + `/g,'').trim();
      const match = clean.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(match ? match[0] : clean);
    } catch(e) { throw new Error('La IA no pudo parsear el texto.'); }
    const leads = parsed.leads || [];
    if (leads.length === 0) {
      document.getElementById('parse-results').innerHTML = `<div style="padding:14px;background:rgba(245,158,11,.1);border:1px solid var(--warn);border-radius:8px;font-size:13px;color:#fcd34d">${parsed.mensaje || 'No se encontraron datos de empresas.'}</div>`;
    } else {
      window.__parseResults = leads;
      document.getElementById('parse-results').innerHTML = `
      <div class="form-section">
        <h3>${leads.length} empresa(s) extraida(s)</h3>
        ${leads.map((l,i) => `
        <div class="lead-result" id="pr-item-${i}">
          <div class="lead-result-info" style="flex:1">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <div class="form-group" style="margin:0"><label style="font-size:10px">Empresa</label><input id="pr-empresa-${i}" value="${(l.empresa||'').replace(/"/g,'')}" style="font-size:12px;padding:4px 8px"></div>
              <div class="form-group" style="margin:0"><label style="font-size:10px">Nombre contacto</label><input id="pr-nombre-${i}" value="${(l.nombre||'').replace(/"/g,'')}" style="font-size:12px;padding:4px 8px"></div>
              <div class="form-group" style="margin:0"><label style="font-size:10px">Tipo</label><select id="pr-tipo-${i}" style="font-size:12px;padding:4px 8px">${['despachante','estudio_aduanero','operador_logistico','importador_exportador','agro_industrial','empresa'].map(t=>`<option ${l.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
              <div class="form-group" style="margin:0"><label style="font-size:10px">Ciudad</label><input id="pr-ciudad-${i}" value="${(l.ciudad||'').replace(/"/g,'')}" style="font-size:12px;padding:4px 8px"></div>
              <div class="form-group" style="margin:0"><label style="font-size:10px">Email</label><input id="pr-email-${i}" value="${(l.email||'').replace(/"/g,'')}" style="font-size:12px;padding:4px 8px"></div>
              <div class="form-group" style="margin:0"><label style="font-size:10px">Telefono</label><input id="pr-tel-${i}" value="${(l.telefono||'').replace(/"/g,'')}" style="font-size:12px;padding:4px 8px"></div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-left:10px">
            <button class="btn btn-success btn-sm" id="pr-add-btn-${i}" onclick="addLeadFromParse(${i})">+ Agregar</button>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('pr-item-${i}').remove()">X</button>
          </div>
        </div>`).join('')}
        ${leads.length > 1 ? `<button class="btn btn-primary" style="margin-top:8px" onclick="addAllFromParse()">+ Agregar todos (${leads.length})</button>` : ''}
      </div>`;
    }
  } catch(e) {
    document.getElementById('parse-results').innerHTML = `<div style="padding:14px;background:rgba(239,68,68,.1);border:1px solid var(--danger);border-radius:8px;font-size:13px;color:#fca5a5">${parseApiError(e, 'groq')}</div>`;
  }
  document.getElementById('parse-loading').classList.add('hidden');
}

async function addLeadFromParse(idx) {
  const data = {
    empresa:  document.getElementById(`pr-empresa-${idx}`)?.value.trim(),
    nombre:   document.getElementById(`pr-nombre-${idx}`)?.value.trim(),
    tipo:     document.getElementById(`pr-tipo-${idx}`)?.value,
    ciudad:   document.getElementById(`pr-ciudad-${idx}`)?.value.trim(),
    email:    document.getElementById(`pr-email-${idx}`)?.value.trim().toLowerCase(),
    telefono: document.getElementById(`pr-tel-${idx}`)?.value.trim(),
    web:      (window.__parseResults?.[idx]?.web||'').trim(),
    zona:     (window.__parseResults?.[idx]?.zona||'').trim(),
    fuente:   'manual',
    email_status: 'sin_verificar',
  };
  if (!data.empresa && !data.nombre) return showToast('Falta empresa o nombre', 'err');
  if (data.email && allLeads.some(l => l.email === data.email)) return showToast('Ya existe un lead con ese email', 'warn');
  const btn = document.getElementById(`pr-add-btn-${idx}`);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const res = await sbInsert('leads', data);
    allLeads.unshift(res[0]||data);
    document.getElementById('badge-leads').textContent = allLeads.length;
    showToast('Agregado: ' + (data.empresa||data.nombre), 'ok');
    document.getElementById(`pr-item-${idx}`)?.remove();
  } catch(e) {
    showToast(parseApiError(e, 'supabase'), 'err');
    if (btn) { btn.disabled = false; btn.textContent = '+ Agregar'; }
  }
}

async function addAllFromParse() {
  const results = window.__parseResults || [];
  let added = 0, skipped = 0;
  for (let i = 0; i < results.length; i++) {
    const item = document.getElementById(`pr-item-${i}`);
    if (!item) { skipped++; continue; }
    const data = {
      empresa:  document.getElementById(`pr-empresa-${i}`)?.value.trim() || results[i].empresa,
      nombre:   document.getElementById(`pr-nombre-${i}`)?.value.trim()  || results[i].nombre,
      tipo:     document.getElementById(`pr-tipo-${i}`)?.value            || results[i].tipo,
      ciudad:   document.getElementById(`pr-ciudad-${i}`)?.value.trim()  || results[i].ciudad,
      email:    (document.getElementById(`pr-email-${i}`)?.value.trim()  || results[i].email||'').toLowerCase(),
      telefono: document.getElementById(`pr-tel-${i}`)?.value.trim()     || results[i].telefono,
      web: results[i].web||'', zona: results[i].zona||'', fuente: 'manual', email_status: 'sin_verificar',
    };
    if (!data.empresa && !data.nombre) { skipped++; continue; }
    if (data.email && allLeads.some(l => l.email === data.email)) { skipped++; continue; }
    try {
      const res = await sbInsert('leads', data);
      allLeads.unshift(res[0]||data);
      document.getElementById('badge-leads').textContent = allLeads.length;
      item.remove();
      added++;
    } catch(e) { skipped++; }
  }
  showToast(added + ' leads agregados' + (skipped?' Â· '+skipped+' omitidos':''), 'ok');
}

function renderLeadPicker() {
  const q = (document.getElementById('red-search')?.value||'').toLowerCase();
  const filtered = allLeads.filter(l => {
    if (l.estado === 'contactado' || l.estado === 'no_interesado') return false;
    const t = (l.nombre||'') + ' ' + (l.empresa||'') + ' ' + (l.ciudad||'');
    return !q || t.toLowerCase().includes(q);
  }).slice(0, 40);
  const picker = document.getElementById('lead-picker');
  if (!picker) return;
  picker.innerHTML = filtered.map(l=>`
    <div onclick="selectLead(${l.id})" style="padding:8px;border-radius:6px;cursor:pointer;margin-bottom:4px;background:${currentLead?.id===l.id?'rgba(59,130,246,.15)':'#0d1117'};border:1px solid ${currentLead?.id===l.id?'var(--accent)':'var(--border)'}">

    </div>`).join('');
}

function selectLead(id) {
  currentLead = allLeads.find(l => l.id === id);

async function iaRecomendaEnfoques() {
  if (!currentLead) return showToast('Selecciona un lead primero', 'warn');
  document.getElementById('enfoque-loading').classList.remove('hidden');
  document.getElementById('ia-recomendacion').style.display = 'none';
  const prompt = `Analiza este lead y recomienda cuales enfoques usar para Puerto Seco Rojas.
Lead: Empresa: ${currentLead.empresa||currentLead.nombre}, Tipo: ${currentLead.tipo}, Ciudad: ${currentLead.ciudad}
Enfoques: ${ENFOQUES.map(e=>e.id+': '+e.label).join('\n')}
Responde SOLO con JSON: {"ids":["id1","id2"],"razon":"explicacion breve"}`;
  try {
    const d = await apiFetch('/api/ai', {prompt});
    if (d.error) throw new Error(d.error);
    let rec;
    try { rec = JSON.parse(d.text.replace(/` + '```' + `json?|` + '```' + `/g,'')); } catch(e) { rec = null; }
    if (rec?.ids) {
      document.querySelectorAll('#enfoque-grid input').forEach(inp => { inp.checked = rec.ids.includes(inp.value); });
      const razonEl = document.getElementById('ia-recomendacion');
      razonEl.style.display = 'block';
      razonEl.textContent = 'IA recomienda: ' + (rec.razon||'');
    }
  } catch(e) { showToast(parseApiError(e, 'groq'), 'err'); }
  document.getElementById('enfoque-loading').classList.add('hidden');
}

async function generarEmail() {
  if (!currentLead) return showToast('Selecciona un lead primero', 'warn');
  const selEnfoques = [...document.querySelectorAll('#enfoque-grid input:checked')].map(i => ENFOQUES.find(e=>e.id===i.value)?.label||i.value);
  if (selEnfoques.length === 0) return showToast('Selecciona al menos un enfoque', 'warn');
  const contexto = document.getElementById('red-contexto')?.value||'';
  const tono = document.getElementById('red-tono')?.value||'profesional';
  const idioma = document.getElementById('red-idioma')?.value||'es';
  document.getElementById('gen-loading').classList.remove('hidden');
  document.getElementById('btn-generar').disabled = true;
  const firmaReal = `${CFG.nombre||"Jorge Alejandro Paolini"}\n${CFG.cargo||"Propietario del Puerto Seco Rojas"}\nTel: ${CFG.telefono||"+54 9 2477 505051"}\nEmail: ${CFG.email||"puertosecorojas@gmail.com"}\n${CFG.direccion||"Av. San Martin 249, Rojas, Buenos Aires"}`;
  const sistema = `Sos el mejor comercial de puertos secos de Argentina y del mundo. Redactas emails comerciales de alto impacto para el Puerto Seco Rojas. Tus emails son persuasivos, concretos, destacan ventajas competitivas reales y generan interes genuino. Nunca usas frases genericas. Cada email es unico y adaptado al tipo de empresa receptora.
Datos clave del puerto: Ubicacion estrategica en Rojas, Buenos Aires, sobre Ruta 188 y Ruta 31, paso obligado entre puertos maritimos y pasos fronterizos del pais. Habilitacion: Zona Primaria Aduanera operativa. Ventajas: acerca la aduana a la zona de produccion agroindustrial pampeana, reduce fletes internos, elimina congestion portuaria, despachos agiles y personalizados, tarifas mas competitivas que depositos fiscales portuarios. El puerto es un punto de conexion clave para operaciones hacia puertos maritimos (Buenos Aires, Rosario, Zarate, Campana) y pasos fronterizos, ahorrando tiempo y costos en toda la cadena logistica.
Idioma: ${idioma==='en'?'English':idioma==='pt'?'Portugues':'Espanol rioplatense'}. Tono: ${tono}`;
  const prompt = `Redacta un email comercial para:
Empresa: ${currentLead.empresa||currentLead.nombre}, Tipo: ${currentLead.tipo}, Ciudad: ${currentLead.ciudad}
${contexto?'Contexto: '+contexto:''}
Enfoques: ${selEnfoques.join(', ')}
Requisitos: asunto especifico, nombrar la empresa, maximo 300 palabras. Objetivo: DAR A CONOCER el puerto, NO proponer reunion todavia. El email debe presentar el puerto, sus ventajas concretas, y terminar invitando a conocer mas o hacer consultas. La firma debe incluir nombre completo, cargo, telefono y email.
Devuelve el resultado en este formato exacto (sin JSON, sin comillas, sin markdown):
ASUNTO: [el asunto aqui]
CUERPO:
[el cuerpo completo aqui]`;
  try {
    const d = await apiFetch('/api/ai', {prompt, system: sistema});
    if (d.error) throw new Error(d.error);
    let parsed;
    try {
      const txt = d.text.trim();
      const asuntoMatch = txt.match(/ASUNTO:\s*(.+)/);
      const cuerpoMatch = txt.match(/CUERPO:\s*\n([\s\S]+)/);
      parsed = {
        asunto: asuntoMatch ? asuntoMatch[1].trim() : ('Propuesta Puerto Seco Rojas - ' + (currentLead.empresa||currentLead.nombre)),
        cuerpo: (cuerpoMatch ? cuerpoMatch[1].trim() : txt).replace(/\n?\s*(Atentamente|Cordialmente|Saludos|Regards)[\s\S]*/i, "").trimEnd()
      };
    } catch(e) { parsed = { asunto: 'Propuesta Puerto Seco Rojas - ' + (currentLead.empresa||currentLead.nombre), cuerpo: d.text }; }
    if (!parsed.asunto || !parsed.cuerpo) parsed = { asunto: 'Propuesta Puerto Seco Rojas - ' + (currentLead.empresa||currentLead.nombre), cuerpo: d.text };
    document.getElementById('preview-section').style.display = 'block';
    document.getElementById('red-to').value = currentLead.email||'';
    document.getElementById('red-subject').value = parsed.asunto||'';
    const firmaSaltos = `\n\nAtentamente,\n${CFG.nombre||'Jorge Alejandro Paolini'}\n${CFG.cargo||'Propietario del Puerto Seco Rojas'}\nTel: ${CFG.telefono||'+54 9 2477 505051'}\nEmail: ${CFG.email||'puertosecorojas@gmail.com'}\n${CFG.direccion||'Av. San Martin 249, Rojas, Buenos Aires'}`;
    document.getElementById('red-body').value = (parsed.cuerpo||'') + firmaSaltos;
    const dup = (currentLead.email||'') && allEnviados.some(e => e.destinatario_email === currentLead.email);
    document.getElementById('dup-warning').classList.toggle('hidden', !dup);
    document.getElementById('preview-section').scrollIntoView({ behavior:'smooth' });
  } catch(e) { showToast(parseApiError(e, 'groq'), 'err'); }
  document.getElementById('gen-loading').classList.add('hidden');
  document.getElementById('btn-generar').disabled = false;
}

async function enviarEmail() {
  const to = document.getElementById('red-to').value.trim();
  const subject = document.getElementById('red-subject').value.trim();
  const body = document.getElementById('red-body').value.trim();
  if (!to || !subject || !body) return showToast('Completa todos los campos', 'err');
  const dup = allEnviados.some(e => e.destinatario_email === to);
  if (dup && !confirm('Ya enviaste un email a ' + to + ' antes. Enviarlo igual?')) return;
  document.getElementById('send-loading').classList.remove('hidden');
  const htmlBody = body.split('\n').map(l => l ? `<p>${l}</p>` : '<br>').join('');
  try {
    const r = await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to, subject, html: htmlBody, text: body, leadId: currentLead?.id||null, nombreLead: currentLead?.nombre||currentLead?.empresa||'', ciudadLead: currentLead?.ciudad||'', enfoque: [...document.querySelectorAll('#enfoque-grid input:checked')].map(i=>i.value).join(',')})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error||'Error de envio');
    const selEnfoques = [...document.querySelectorAll('#enfoque-grid input:checked')].map(i=>i.value);
    const emailData = {
      lead_id: currentLead?.id||null,
      destinatario_email: to,
      destinatario_nombre: currentLead?.nombre||currentLead?.empresa||'',
      empresa: currentLead?.empresa||'',
      ciudad: currentLead?.ciudad||'',
      asunto: subject,
      cuerpo: body,
      enfoques_usados: selEnfoques,
      estado: 'enviado',
    };
    try {
      const saved = await sbInsert('emails_enviados', emailData);
      allEnviados.unshift(saved[0]||emailData);
      document.getElementById('badge-enviados').textContent = allEnviados.length;
    } catch(e2) {}
    if (currentLead) {
      try {
        await sbUpdate('leads', currentLead.id, { contactado: true, estado: 'contactado' });
        const l = allLeads.find(x => x.id === currentLead.id);
        if (l) { l.contactado = true; l.estado = 'contactado'; }
      } catch(e2) {}
    }
    showToast('Email enviado correctamente a ' + to, 'ok');
    document.getElementById('preview-section').style.display = 'none';
  } catch(e) { showToast(parseApiError(e, 'gmail'), 'err'); }
  document.getElementById('send-loading').classList.add('hidden');
}

    const t = `${e.destinatario_email||''} ${e.destinatario_nombre||''} ${e.empresa||''} ${e.asunto||''}`.toLowerCase();
    if (q && !t.includes(q)) return false;

  });
  document.getElementById('env-list').innerHTML = filtered.map(e=>`

      <div>
        <strong>${e.destinatario_nombre||e.destinatario_email}</strong>

      ${['enviado','respondido','interesado','no_interesado','rebotado'].map(s=>`
        <button class="btn btn-ghost btn-sm" style="${e.estado===s?'border-color:var(--accent);color:var(--accent)':''}" onclick="updateEstadoEnviado(${e.id},'${s}','${e.lead_id||''}')">
          ${s.replace('_',' ')}
        </button>`).join('')}
    </div>
  </div>`).join('') || '<p class="text-muted text-sm">Sin emails en historial.</p>';
}

async function updateEstadoEnviado(id, estado, leadId) {
  try {
    await sbUpdate('emails_enviados', id, { estado });
    const e = allEnviados.find(x=>x.id===id);
    if (e) e.estado = estado;
    filterEnviados();
    if (leadId && estado === 'respondido') {
      await sbUpdate('leads', leadId, { estado: 'interesado' });
      const l = allLeads.find(x=>x.id==leadId);
      if (l) l.estado = 'interesado';
    }
  } catch(ex) { showToast('Error: '+ex.message,'err'); }
}

async function saveAllKeys() {
  const url    = document.getElementById('k-surl')?.value.trim();
  const skey   = document.getElementById('k-skey')?.value.trim();
  const groq   = document.getElementById('k-groq')?.value.trim();
  const apollo = document.getElementById('k-apollo')?.value.trim();
  const hunter = document.getElementById('k-hunter')?.value.trim();
  const apify  = document.getElementById('k-apify')?.value.trim();
  const st = document.getElementById('k-status');
  const toSave = {};
  if (url)    toSave.supabaseUrl = url;
  if (skey)   toSave.supabaseKey = skey;
  if (groq)   toSave.groqKey    = groq;
  if (apollo) toSave.apolloKey  = apollo;
  if (hunter) toSave.hunterKey  = hunter;
  if (apify)  toSave.apifyKey   = apify;
  saveKeysToStorage(toSave);
  if (url)  DB.url = url;
  if (skey) DB.key = skey;
  st.textContent = 'Guardado. Verificando Supabase...';
  const ok = await checkConnection();
  st.textContent = ok ? 'Keys guardadas y Supabase conectado' : 'Keys guardadas pero Supabase no conecta';
  if (ok) { await Promise.all([loadLeads(), loadEnviados(), loadCfg()]); }
}

async function saveSupabaseKeys() { return saveAllKeys(); }

async function runStatusChecks() {
  const setSt = (id, ok, msg) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = ok ? `<span style="color:#4ade80">OK</span>` : `<span style="color:#f87171" title="${msg}">ERROR: ${(msg||'').substring(0,40)}</span>`;
  };
  try {
    const r = await sbFetch('configuracion?select=id&limit=1');
    setSt('sc-supabase', r.ok, r.ok ? '' : 'Error HTTP '+r.status);
  } catch(e) { setSt('sc-supabase', false, parseApiError(e,'supabase')); }
  try {
    const d = await apiFetch('/api/ai',{prompt:'Responde solo OK'});
    setSt('sc-groq', !d.error && d.text, d.error ? parseApiError({message:d.error},'groq') : '');
  } catch(e) { setSt('sc-groq', false, parseApiError(e,'groq')); }
  try {
    const r = await fetch('/api/config');
    const d = await r.json();
    setSt('sc-apollo', d.hasApollo, d.hasApollo ? '' : 'APOLLO_API_KEY no configurada');
    setSt('sc-hunter', d.hasHunter, d.hasHunter ? '' : 'HUNTER_API_KEY no configurada');
  } catch(e) {
    setSt('sc-apollo', false, 'Error verificando');
    setSt('sc-hunter', false, 'Error verificando');
  }
  try {
    const r = await fetch('/api/gmail-sync', { method: 'POST' });
    const d = await r.json();
    setSt('sc-gmail-api', d.ok || d.error === 'Gmail no conectado', d.error === 'Gmail no conectado' ? 'No conectado - click en Conectar Gmail API' : (d.error||''));
  } catch(e) { setSt('sc-gmail-api', false, 'Error'); }
}

async function sendTestEmail() {
  const res = document.getElementById('test-result');
  if (!CFG.email) { res.innerHTML = '<p style="color:var(--warn)">Configura tu email en la pestana Perfil primero</p>'; return; }
  res.innerHTML = '<span class="spinner"></span> Enviando...';
  try {
    const r = await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to: CFG.email, subject:'Test Puerto Seco Rojas CRM', text:'Este es un email de prueba.'})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    res.innerHTML = `<p style="color:#4ade80">Email de prueba enviado a ${CFG.email}</p>`;
  } catch(e) { res.innerHTML = `<p style="color:var(--danger)">${parseApiError(e,'gmail')}</p>`; }
}

async function saveCfg() {
  const data = {
    nombre:    document.getElementById('cfg-nombre').value.trim(),
    cargo:     document.getElementById('cfg-cargo').value.trim(),
    email:     document.getElementById('cfg-email').value.trim(),
    telefono:  document.getElementById('cfg-tel').value.trim(),
    direccion: document.getElementById('cfg-dir').value.trim(),
    servicios: document.getElementById('cfg-servicios').value.trim(),
    firma:     document.getElementById('cfg-firma').value.trim(),
    updated_at: new Date().toISOString(),
  };
  try {
    await sbUpdate('configuracion', 1, data);
    CFG = { ...CFG, ...data };
    document.getElementById('user-name-sidebar').textContent = CFG.nombre||'Sin configurar';
    document.getElementById('user-email-sidebar').textContent = CFG.email||'â€”';
    showToast('Perfil guardado', 'ok');
  } catch(e) { showToast(parseApiError(e,'supabase'), 'err'); }
}

function tipoBadge(tipo) {
  const map = {despachante:'badge-blue',estudio_aduanero:'badge-purple',operador_logistico:'badge-amber',importador_exportador:'badge-green',agro_industrial:'badge-green',empresa:'badge-gray'};
  return '<span class="badge ' + (map[tipo]||'badge-gray') + '">' + (tipo||'').replace(/_/g,' ') + '</span>';
}

function estadoBadge(estado) {
  const map = {sin_contactar:'badge-gray',contactado:'badge-blue',interesado:'badge-green',reunion_agendada:'badge-purple',no_interesado:'badge-red',sin_respuesta:'badge-amber',enviado:'badge-blue',respondido:'badge-green',rebotado:'badge-red',abierto:'badge-amber'};
  return '<span class="badge ' + (map[estado]||'badge-gray') + '">' + (estado||'').replace(/_/g,' ') + '</span>';
}

function formatFecha(iso) {
  if (!iso) return 'â€”';
  return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function showToast(msg, type) {
  type = type || 'ok';
  const toast = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.textContent = msg;
  toast.appendChild(el);
  setTimeout(function(){ el.remove(); }, 5000);
}
</script>
