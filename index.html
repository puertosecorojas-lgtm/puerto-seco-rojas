<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--sidebar:#161b27;--card:#1e2436;--border:#2a3050;
  --accent:#3b82f6;--accent2:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --text:#e2e8f0;--muted:#8892aa;--white:#fff;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
#sidebar{width:220px;min-width:220px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.logo{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.logo h1{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.5px;line-height:1.3}
.logo p{font-size:11px;color:var(--muted);margin-top:2px}
#connection-badge{margin:8px 16px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;text-align:center;background:#1a2a1a;color:#4ade80;border:1px solid #2d5a2d}
#connection-badge.off{background:#2a1a1a;color:#f87171;border-color:#5a2d2d}
nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(59,130,246,.08);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent);border-left-color:var(--accent)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--sidebar)}
.topbar-title{font-size:16px;font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:20px}

/* CARDS & STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-card .val{font-size:28px;font-weight:700;color:var(--white)}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:4px}
.stat-card .sub{font-size:12px;color:var(--accent2);margin-top:6px}

/* TABLE */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-toolbar{padding:12px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(42,48,80,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(59,130,246,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:#93c5fd}
.badge-green{background:rgba(16,185,129,.2);color:#6ee7b7}
.badge-amber{background:rgba(245,158,11,.2);color:#fcd34d}
.badge-red{background:rgba(239,68,68,.2);color:#fca5a5}
.badge-gray{background:rgba(100,116,139,.2);color:#94a3b8}
.badge-purple{background:rgba(139,92,246,.2);color:#c4b5fd}

/* FORMS */
.form-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.form-section h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#111827}
textarea{resize:vertical;min-height:80px}
select option{background:#1e2436}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-success{background:var(--accent2);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ENFOQUE GRID */
.enfoque-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.enfoque-item{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:.15s;display:flex;gap:8px;align-items:flex-start}
.enfoque-item:hover{border-color:var(--accent)}
.enfoque-item.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.enfoque-item input[type=checkbox]{width:14px;height:14px;margin-top:1px;flex-shrink:0;accent-color:var(--accent)}
.enfoque-item span{font-size:12px;line-height:1.4;color:var(--text)}

/* PREVIEW */
#email-preview-box{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:300px;overflow-y:auto}
#email-preview-box.empty{color:var(--muted);font-style:italic}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:420px;max-width:600px;width:90%}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}

/* LEAD RESULT ITEMS */
.lead-result{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lead-result-info{flex:1}
.lead-result-info strong{font-size:13px;display:block;margin-bottom:2px}
.lead-result-info span{font-size:12px;color:var(--muted)}
.lead-result-actions{display:flex;gap:6px;flex-shrink:0}

/* EMAIL HISTORY */
.email-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.email-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.email-item-body{font-size:12px;color:var(--muted);line-height:1.5;max-height:60px;overflow:hidden}

/* STATUS COLORS */
.status-sin_contactar{color:var(--muted)}
.status-contactado{color:#93c5fd}
.status-interesado{color:#6ee7b7}
.status-reunion_agendada{color:#c4b5fd}
.status-no_interesado{color:#fca5a5}
.status-sin_respuesta{color:#fcd34d}

/* TABS dentro de secciones */
.inner-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.inner-tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.inner-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* SPINNER */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;pointer-events:auto;animation:fadeIn .2s ease}
.toast-item.ok{border-left:3px solid var(--accent2)}
.toast-item.err{border-left:3px solid var(--danger)}
.toast-item.warn{border-left:3px solid var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hidden{display:none!important}
.flex{display:flex}
.gap-2{gap:8px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.text-muted{color:var(--muted)}
.text-sm{font-size:12px}
.w-full{width:100%}
</style>

<script>
// =====================================================================
// ESTADO GLOBAL
// =====================================================================
let DB = { url: '', key: '' };
let CFG = {};
let allLeads = [];
let allEnviados = [];
let currentLead = null;
let emailBody = '';

// =====================================================================
// MANEJO DE ERRORES â€” mensajes descriptivos por tipo
// =====================================================================
function parseApiError(err, service) {
  const msg = (err?.message || err?.error?.message || String(err)).toLowerCase();
  // Groq
  if (service === 'groq' || msg.includes('groq')) {
    if (msg.includes('rate_limit') || msg.includes('rate limit') || msg.includes('tokens per minute'))
      return 'â± Groq: lÃ­mite de velocidad alcanzado. EsperÃ¡ 60 segundos e intentÃ¡ de nuevo.';
    if (msg.includes('insufficient_quota') || msg.includes('quota') || msg.includes('billing'))
      return 'ðŸ’³ Groq: se agotaron los tokens del plan gratuito. RevisÃ¡ console.groq.com';
    if (msg.includes('invalid') && msg.includes('key'))
      return 'ðŸ”‘ Groq: API key invÃ¡lida. VerificÃ¡ la clave en ConfiguraciÃ³n â†’ Keys.';
    if (msg.includes('model_not_found') || msg.includes('model'))
      return 'ðŸ¤– Groq: modelo no disponible. ContactÃ¡ soporte.';
  }
  // Hunter
  if (service === 'hunter' || msg.includes('hunter')) {
    if (msg.includes('429') || msg.includes('too many') || msg.includes('limit'))
      return 'ðŸ“§ Hunter.io: lÃ­mite de bÃºsquedas alcanzado (plan gratuito: 25/mes). EsperÃ¡ al prÃ³ximo mes.';
    if (msg.includes('401') || msg.includes('unauthorized') || msg.includes('invalid key'))
      return 'ðŸ”‘ Hunter.io: API key invÃ¡lida. VerificÃ¡ la clave en Vercel â†’ Environment Variables.';
  }
  // Apollo
  if (service === 'apollo' || msg.includes('apollo')) {
    if (msg.includes('429') || msg.includes('rate') || msg.includes('limit'))
      return 'ðŸ”­ Apollo.io: lÃ­mite de bÃºsquedas alcanzado. EsperÃ¡ y volvÃ© a intentar.';
    if (msg.includes('401') || msg.includes('unauthorized') || msg.includes('invalid'))
      return 'ðŸ”‘ Apollo.io: API key invÃ¡lida. VerificÃ¡ la clave en Vercel â†’ Environment Variables.';
    if (msg.includes('no configurada') || msg.includes('not configured'))
      return 'ðŸ”‘ Apollo.io: key no configurada. AgregÃ¡ APOLLO_API_KEY en Vercel â†’ Environment Variables.';
  }
  // Gmail / Nodemailer
  if (service === 'gmail' || msg.includes('gmail') || msg.includes('smtp')) {
    if (msg.includes('invalid login') || msg.includes('username and password') || msg.includes('535'))
      return 'ðŸ“¬ Gmail: contraseÃ±a de app incorrecta. GenerÃ¡ una nueva en myaccount.google.com/apppasswords y actualizÃ¡ GMAIL_PASS en Vercel.';
    if (msg.includes('getaddrinfo') || msg.includes('network') || msg.includes('enotfound'))
      return 'ðŸŒ Gmail: sin conexiÃ³n de red desde el servidor. EsperÃ¡ y reintentÃ¡.';
    if (msg.includes('550') || msg.includes('rejected'))
      return 'ðŸš« Gmail: el email fue rechazado por el servidor destino (puede ser invÃ¡lido).';
  }
  // Supabase
  if (service === 'supabase' || msg.includes('supabase') || msg.includes('jwt') || msg.includes('pgrst')) {
    if (msg.includes('jwt') || msg.includes('invalid key') || msg.includes('apikey'))
      return 'ðŸ”‘ Supabase: clave invÃ¡lida. VerificÃ¡ SUPABASE_ANON_KEY en ConfiguraciÃ³n â†’ Keys.';
    if (msg.includes('does not exist') || msg.includes('relation') || msg.includes('table'))
      return 'ðŸ—„ Supabase: tabla no encontrada. EjecutÃ¡ el schema SQL en Supabase â†’ SQL Editor.';
    if (msg.includes('fetch') || msg.includes('network') || msg.includes('failed'))
      return 'ðŸŒ Supabase: sin conexiÃ³n. VerificÃ¡ SUPABASE_URL en ConfiguraciÃ³n â†’ Keys.';
  }
  // GenÃ©rico
  return `âŒ Error: ${err?.message || String(err)}`;
}

// =====================================================================
// KEYS â€” guardar y cargar desde localStorage (TODAS las keys)
// =====================================================================
let KEYS = {};  // cache en memoria de todas las keys del panel

function loadKeysFromStorage() {
  KEYS = JSON.parse(localStorage.getItem('crm_keys') || '{}');
  if (KEYS.supabaseUrl) DB.url = KEYS.supabaseUrl;
  if (KEYS.supabaseKey) DB.key = KEYS.supabaseKey;
}

function saveKeysToStorage(newKeys) {
  KEYS = { ...KEYS, ...newKeys };
  localStorage.setItem('crm_keys', JSON.stringify(KEYS));
}

// Helper: inyecta las keys del panel en el body de cada llamada a la API
function withKeys(body) {
  const k = {};
  if (KEYS.groqKey)    k._groqKey   = KEYS.groqKey;
  if (KEYS.apolloKey)  k._apolloKey = KEYS.apolloKey;
  if (KEYS.hunterKey)  k._hunterKey = KEYS.hunterKey;
  return { ...body, ...k };
}

// Wrapper para fetch a APIs del servidor â€” inyecta keys automÃ¡ticamente
async function apiFetch(endpoint, body) {
  const r = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(withKeys(body)),
  });
  return r.json();
}

// =====================================================================
// INIT
// =====================================================================
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('es-AR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  // 1. Cargar keys guardadas localmente (prioridad mÃ¡xima)
  loadKeysFromStorage();

  // 2. Si faltan, intentar obtener de /api/config (Vercel env vars)
  if (!DB.url || !DB.key) {
    try {
      const r = await fetch('/api/config');
      if (r.ok) {
        const c = await r.json();
        if (!DB.url && c.supabaseUrl) DB.url = c.supabaseUrl;
        if (!DB.key && c.supabaseKey) DB.key = c.supabaseKey;
      }
    } catch(e){}
  }

  // Verificar conexiÃ³n a Supabase
  await checkConnection();

  // Cargar datos
  await Promise.all([loadLeads(), loadEnviados(), loadCfg()]);

  // Mostrar dashboard
  renderPage('dashboard');

  // NavegaciÃ³n
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => renderPage(el.dataset.page));
  });
});

async function checkConnection() {
  const badge = document.getElementById('connection-badge');
  if (!DB.url || !DB.key) {
    badge.textContent = 'â— Sin Supabase â€” configurar Keys';
    badge.classList.add('off');
    badge.title = 'AndÃ¡ a ConfiguraciÃ³n â†’ Keys e ingresÃ¡ la URL y clave de Supabase';
    badge.style.cursor = 'pointer';
    badge.onclick = () => renderPage('config');
    return false;
  }
  try {
    const r = await sbFetch('configuracion?select=id&limit=1');
    if (r.ok) {
      badge.textContent = 'â— Conectado a Supabase';
      badge.classList.remove('off');
      badge.onclick = null;
      return true;
    }
    const txt = await r.text();
    badge.textContent = 'â— Error Supabase';
    badge.classList.add('off');
    badge.title = parseApiError({ message: txt }, 'supabase');
    return false;
  } catch(e) {
    badge.textContent = 'â— Sin conexiÃ³n';
    badge.classList.add('off');
    badge.title = parseApiError(e, 'supabase');
    return false;
  }
}

// =====================================================================
// SUPABASE REST
// =====================================================================
async function sbFetch(path, options = {}) {
  if (!DB.url || !DB.key) throw new Error('Supabase no configurado');
  const url = `${DB.url}/rest/v1/${path}`;
  const opts = {
    ...options,
    headers: {
      'apikey': DB.key,
      'Authorization': `Bearer ${DB.key}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(options.headers || {}),
    },
  };
  return fetch(url, opts);
}

async function sbGet(table, query = '') {
  const r = await sbFetch(`${table}?${query}`);
  if (!r.ok) throw new Error(`Error cargando ${table}`);
  return r.json();
}

async function sbInsert(table, data) {
  const r = await sbFetch(table, { method: 'POST', body: JSON.stringify(data) });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}

async function sbUpdate(table, id, data) {
  const r = await sbFetch(`${table}?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(data) });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}

async function sbDelete(table, id) {
  const r = await sbFetch(`${table}?id=eq.${id}`, { method: 'DELETE' });
  if (!r.ok) throw new Error('Error eliminando');
}

// =====================================================================
// CARGA DE DATOS
// =====================================================================
async function loadLeads() {
  try {
    const data = await sbGet('leads', 'order=created_at.desc&limit=500');
    allLeads = data;
    document.getElementById('badge-leads').textContent = allLeads.length;
  } catch(e) {
    allLeads = [];
  }
}

async function loadEnviados() {
  try {
    const data = await sbGet('emails_enviados', 'order=fecha_envio.desc&limit=500');
    allEnviados = data;
    document.getElementById('badge-enviados').textContent = allEnviados.length;
  } catch(e) {
    allEnviados = [];
  }
}

async function loadCfg() {
  try {
    const data = await sbGet('configuracion', 'id=eq.1&limit=1');
    CFG = data[0] || {};
    document.getElementById('user-name-sidebar').textContent = CFG.nombre || 'Sin configurar';
    document.getElementById('user-email-sidebar').textContent = CFG.email || 'â€”';
  } catch(e) {
    CFG = {};
  }
}

async function refreshAll() {
  showToast('Actualizando datosâ€¦', 'warn');
  await Promise.all([loadLeads(), loadEnviados(), loadCfg()]);
  renderPage(currentPage());
  showToast('Datos actualizados', 'ok');
}

function currentPage() {
  return document.querySelector('.nav-item.active')?.dataset?.page || 'dashboard';
}

// =====================================================================
// NAVEGACIÃ“N
// =====================================================================
function renderPage(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const titles = {
    dashboard:'Dashboard',leads:'Leads',buscar:'Buscar Leads',
    redactar:'Redactar Email',enviados:'Emails Enviados',
    aliados:'Despachantes Aliados',config:'ConfiguraciÃ³n'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  const fn = { dashboard:pageDashboard, leads:pageLeads, buscar:pageBuscar,
    redactar:pageRedactar, enviados:pageEnviados, aliados:pageAliados, config:pageConfig };
  (fn[page] || (() => {}))();
}

// =====================================================================
// DASHBOARD
// =====================================================================
function pageDashboard() {
  const total = allLeads.length;
  const contactados = allLeads.filter(l => l.contactado).length;
  const interesados = allLeads.filter(l => l.estado === 'interesado' || l.estado === 'reunion_agendada').length;
  const hoy = allEnviados.filter(e => {
    const d = new Date(e.fecha_envio);

function filterLeads() {

  const estado = document.getElementById('filter-estado')?.value||'';
  const zona = document.getElementById('filter-zona')?.value||'';

  const filtered = allLeads.filter(l => {
    const text = `${l.nombre||''} ${l.empresa||''} ${l.ciudad||''} ${l.email||''}`.toLowerCase();
    if (q && !text.includes(q)) return false;
    if (tipo && l.tipo !== tipo) return false;
    if (estado && l.estado !== estado) return false;
    if (zona && !(l.zona||'').includes(zona)) return false;
    return true;
  });

  const tbody = document.getElementById('leads-tbody');
  if (!tbody) return;
  tbody.innerHTML = filtered.map(l => `

            l.email?'<span title="Sin verificar" style="color:#fcd34d">?</span>':
            '<span style="color:var(--muted)">â€”</span>'}
          <span style="font-size:12px">${l.email||'sin email'}</span>
        </div>
        ${l.telefono?`<div class="text-muted text-sm">${l.telefono}</div>`:''}
      </td>
      <td>${estadoBadge(l.estado)}</td>
      <td><span class="badge badge-gray" style="font-size:10px">${l.fuente||'manual'}</span></td>

async function verifyEmailLead(id, email) {
  showToast('Verificando emailâ€¦', 'warn');
  try {
    const d = await apiFetch('/api/hunter', { action:'verify', email });
    if (d.error) throw new Error(d.error);
    const status = d.valid ? 'verificado' : d.status === 'invalid' ? 'invalido' : 'sin_verificar';
    await sbUpdate('leads', id, { email_status: status });
    const lead = allLeads.find(l => l.id === id);
    if (lead) lead.email_status = status;
    const icon = d.valid ? 'âœ…' : d.status === 'invalid' ? 'âŒ' : 'âš ';
    showToast(`${icon} Email ${status} â€” score ${d.score}/100`, d.valid ? 'ok' : 'err');
    filterLeads();
  } catch(e) {
    showToast(parseApiError(e, 'hunter'), 'err');
  }
}

async function deleteLead(id) {
  if (!confirm('Â¿Eliminar este lead?')) return;
  try {
    await sbDelete('leads', id);
    allLeads = allLeads.filter(l => l.id !== id);
    document.getElementById('badge-leads').textContent = allLeads.length;
    filterLeads();
    showToast('Lead eliminado', 'ok');
  } catch(e) {
    showToast('Error: ' + e.message, 'err');
  }
}

function editLead(id) {
  const l = allLeads.find(x => x.id === id);
  if (!l) return;
  showModalLead(l);
}

async function saveLead(id) {
  const data = {
    nombre:   document.getElementById('ml-nombre').value.trim(),
    empresa:  document.getElementById('ml-empresa').value.trim(),
    tipo:     document.getElementById('ml-tipo').value,
    ciudad:   document.getElementById('ml-ciudad').value.trim(),
    zona:     document.getElementById('ml-zona').value,
    email:    document.getElementById('ml-email').value.trim().toLowerCase(),
    telefono: document.getElementById('ml-tel').value.trim(),
    web:      document.getElementById('ml-web').value.trim(),
    notas:    document.getElementById('ml-notas').value.trim(),
    fuente:   'manual',
  };
  if (!data.nombre && !data.empresa) return showToast('IngresÃ¡ nombre o empresa', 'err');
  try {
    if (id) {
      await sbUpdate('leads', id, data);
      const i = allLeads.findIndex(l => l.id === id);
      if (i >= 0) allLeads[i] = { ...allLeads[i], ...data };
      showToast('Lead actualizado', 'ok');
    } else {
      const res = await sbInsert('leads', data);
      allLeads.unshift(res[0]||data);
      document.getElementById('badge-leads').textContent = allLeads.length;
      showToast('Lead agregado', 'ok');
    }
    document.querySelector('.modal-overlay')?.remove();
    filterLeads();
  } catch(e) {
    showToast('Error: ' + e.message, 'err');
  }
}

async function addLeadFromParse(idx) {

    web:      (window.__parseResults?.[idx]?.web||'').trim(),
    linkedin: (window.__parseResults?.[idx]?.linkedin||'').trim(),
    notas:    (window.__parseResults?.[idx]?.notas||'').trim(),
    zona:     (window.__parseResults?.[idx]?.zona||'').trim(),
    fuente:   'manual',
    email_status: 'sin_verificar',
  };
  if (!data.empresa && !data.nombre) return showToast('Falta empresa o nombre', 'err');

  // Anti-duplicado
  if (data.email && allLeads.some(l => l.email === data.email)) {
    return showToast(`âš  Ya existe un lead con el email ${data.email}`, 'warn');
  }

  const btn = document.getElementById(`pr-add-btn-${idx}`);

  try {
    const res = await sbInsert('leads', data);
    allLeads.unshift(res[0]||data);
    document.getElementById('badge-leads').textContent = allLeads.length;
    showToast(`âœ… Agregado: ${data.empresa||data.nombre}`, 'ok');
    document.getElementById(`pr-item-${idx}`)?.remove();
  } catch(e) {
    showToast(parseApiError(e, 'supabase'), 'err');
    if (btn) { btn.disabled = false; btn.textContent = '+ Agregar'; }
  }
}

async function addAllFromParse() {
  const results = window.__parseResults || [];
  let added = 0;
  let skipped = 0;
  for (let i = 0; i < results.length; i++) {
    const btn = document.getElementById(`pr-add-btn-${i}`);
    const item = document.getElementById(`pr-item-${i}`);
    if (!item) { skipped++; continue; } // ya fue eliminado/agregado

    const data = {
      empresa:  document.getElementById(`pr-empresa-${i}`)?.value.trim() || results[i].empresa,
      nombre:   document.getElementById(`pr-nombre-${i}`)?.value.trim()  || results[i].nombre,
      tipo:     document.getElementById(`pr-tipo-${i}`)?.value            || results[i].tipo,
      ciudad:   document.getElementById(`pr-ciudad-${i}`)?.value.trim()  || results[i].ciudad,
      email:    (document.getElementById(`pr-email-${i}`)?.value.trim()  || results[i].email||'').toLowerCase(),
      telefono: document.getElementById(`pr-tel-${i}`)?.value.trim()     || results[i].telefono,
      web:      results[i].web||'',
      linkedin: results[i].linkedin||'',
      zona:     results[i].zona||'',
      fuente:   'manual',
      email_status: 'sin_verificar',
    };

    if (!data.empresa && !data.nombre) { skipped++; continue; }
    if (data.email && allLeads.some(l => l.email === data.email)) { skipped++; continue; }

    try {
      const res = await sbInsert('leads', data);
      allLeads.unshift(res[0]||data);
      document.getElementById('badge-leads').textContent = allLeads.length;
      item.remove();
      added++;
    } catch(e) { skipped++; }
  }
  showToast(`âœ… ${added} leads agregados${skipped?' Â· '+skipped+' omitidos (duplicados)':''}`, 'ok');
}

async function enviarEmail() {
  const to = document.getElementById('red-to').value.trim();
  const subject = document.getElementById('red-subject').value.trim();
  const body = document.getElementById('red-body').value.trim();
  if (!to || !subject || !body) return showToast('CompletÃ¡ todos los campos', 'err');

  // Anti-duplicado
  const dup = allEnviados.some(e => e.destinatario_email === to);
  if (dup && !confirm(`Ya enviaste un email a ${to} antes. Â¿QuerÃ©s enviarlo de todas formas?`)) return;

  document.getElementById('send-loading').classList.remove('hidden');

  const htmlBody = body.split('\n').map(l => l ? `<p>${l}</p>` : '<br>').join('');

  try {
    const r = await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to, subject, html: htmlBody, text: body})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error||'Error de envÃ­o');

    // Guardar en Supabase
    const selEnfoques = [...document.querySelectorAll('#enfoque-grid input:checked')].map(i=>i.value);
    const emailData = {
      lead_id: currentLead?.id||null,
      destinatario_email: to,
      destinatario_nombre: currentLead?.nombre||currentLead?.empresa||'',
      empresa: currentLead?.empresa||'',
      ciudad: currentLead?.ciudad||'',
      asunto: subject,
      cuerpo: body,
      enfoques_usados: selEnfoques,
      estado: 'enviado',
    };

    try {
      const saved = await sbInsert('emails_enviados', emailData);
      allEnviados.unshift(saved[0]||emailData);
      document.getElementById('badge-enviados').textContent = allEnviados.length;
    } catch(e2) {}

    // Marcar lead como contactado
    if (currentLead) {
      try {
        await sbUpdate('leads', currentLead.id, { contactado: true, estado: 'contactado', fecha_contacto: new Date().toISOString() });
        const l = allLeads.find(x => x.id === currentLead.id);
        if (l) { l.contactado = true; l.estado = 'contactado'; }
      } catch(e2) {}
    }

    showToast('âœ… Email enviado correctamente a ' + to, 'ok');
    document.getElementById('preview-section').style.display = 'none';
  } catch(e) {
    showToast(parseApiError(e, 'gmail'), 'err');
  }
  document.getElementById('send-loading').classList.add('hidden');
}

async function saveAllKeys() {
  const url    = document.getElementById('k-surl')?.value.trim();
  const skey   = document.getElementById('k-skey')?.value.trim();
  const groq   = document.getElementById('k-groq')?.value.trim();
  const apollo = document.getElementById('k-apollo')?.value.trim();
  const hunter = document.getElementById('k-hunter')?.value.trim();
  const st = document.getElementById('k-status');

  const toSave = {};
  if (url)    toSave.supabaseUrl = url;
  if (skey)   toSave.supabaseKey = skey;
  if (groq)   toSave.groqKey    = groq;
  if (apollo) toSave.apolloKey  = apollo;
  if (hunter) toSave.hunterKey  = hunter;

  saveKeysToStorage(toSave);
  if (url)  DB.url = url;
  if (skey) DB.key = skey;

  st.textContent = 'Guardado âœ“ Verificando Supabaseâ€¦';
  const ok = await checkConnection();
  st.textContent = ok ? 'âœ… Keys guardadas y Supabase conectado' : 'âš  Keys guardadas pero Supabase no conecta â€” verificÃ¡ la URL y la Key';
  if (ok) { await Promise.all([loadLeads(), loadEnviados(), loadCfg()]); }
}

// Mantener compatibilidad con el botÃ³n viejo si existe
async function saveSupabaseKeys() { return saveAllKeys(); }

async function runStatusChecks() {
  // Supabase
  const setSt = (id, ok, msg) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = ok
      ? `<span style="color:#4ade80">âœ… OK</span>`
      : `<span style="color:#f87171" title="${msg}">âŒ ${msg.substring(0,50)}</span>`;
  };

  try {
    const r = await sbFetch('configuracion?select=id&limit=1');
    setSt('sc-supabase', r.ok, r.ok ? '' : 'Error HTTP '+r.status);
  } catch(e) { setSt('sc-supabase', false, parseApiError(e,'supabase')); }

  // Groq â€” test con prompt mÃ­nimo
  try {
    const d = await apiFetch('/api/ai',{prompt:'RespondÃ© solo con la palabra OK'});
    setSt('sc-groq', !d.error && d.text, d.error ? parseApiError({message:d.error},'groq') : '');
  } catch(e) { setSt('sc-groq', false, parseApiError(e,'groq')); }

  // Apollo â€” check via /api/config
  try {
    const r = await fetch('/api/config');
    const d = await r.json();
    setSt('sc-apollo', d.hasApollo, d.hasApollo ? '' : 'APOLLO_API_KEY no configurada en Vercel');
    setSt('sc-hunter', d.hasHunter, d.hasHunter ? '' : 'HUNTER_API_KEY no configurada en Vercel');
  } catch(e) {
    setSt('sc-apollo', false, 'Error verificando');
    setSt('sc-hunter', false, 'Error verificando');
  }
}

async function sendTestEmail() {
  const res = document.getElementById('test-result');
  if (!CFG.email) { res.innerHTML = '<p style="color:var(--warn)">ConfigurÃ¡ tu email en la pestaÃ±a Perfil primero</p>'; return; }
  res.innerHTML = '<span class="spinner"></span> Enviandoâ€¦';
  try {
    const r = await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      to: CFG.email, subject:'âœ… Test Puerto Seco Rojas CRM', text:'Este es un email de prueba. Si llegÃ³, el sistema de envÃ­o funciona correctamente.'
    })});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    res.innerHTML = `<p style="color:#4ade80">âœ… Email de prueba enviado a ${CFG.email} â€” revisÃ¡ tu bandeja</p>`;
  } catch(e) {
    res.innerHTML = `<p style="color:var(--danger)">${parseApiError(e,'gmail')}</p>`;
  }
}

async function saveCfg() {
  const data = {
    nombre:    document.getElementById('cfg-nombre').value.trim(),
    cargo:     document.getElementById('cfg-cargo').value.trim(),
    email:     document.getElementById('cfg-email').value.trim(),
    telefono:  document.getElementById('cfg-tel').value.trim(),
    direccion: document.getElementById('cfg-dir').value.trim(),
    servicios: document.getElementById('cfg-servicios').value.trim(),
    firma:     document.getElementById('cfg-firma').value.trim(),
    updated_at: new Date().toISOString(),
  };
  try {
    await sbUpdate('configuracion', 1, data);
    CFG = { ...CFG, ...data };
    document.getElementById('user-name-sidebar').textContent = CFG.nombre||'Sin configurar';
    document.getElementById('user-email-sidebar').textContent = CFG.email||'â€”';
    showToast('Perfil guardado', 'ok');
  } catch(e) {
    showToast(parseApiError(e,'supabase'), 'err');
  }
}

// GMAIL SYNC
// =====================================================================
function connectGmail() {
  window.location.href = '/api/gmail-auth';
}

async function syncGmail() {
  try {
    const r = await fetch('/api/gmail-sync', { method: 'POST' });
    const d = await r.json();
    if (!d.ok) {
      if (d.error === 'Gmail no conectado') {
        const b = document.getElementById('gmail-badge');
        if(b){ b.textContent = '● Gmail: no conectado — click para conectar'; b.style.color = '#f87171'; }
      }
      return;
    }
    const gmailBadge = document.getElementById('gmail-badge');
    if(gmailBadge){ gmailBadge.textContent = '● Gmail: conectado'; gmailBadge.style.color = '#4ade80'; gmailBadge.style.borderColor = '#2d5a2d'; gmailBadge.style.background = '#1a2a1a'; }
    if (d.nuevas > 0) {
      await Promise.all([loadLeads(), loadEnviados()]);
      const nc = document.getElementById('notif-count');
      const nb = document.getElementById('notif-badge');
      if(nc) nc.textContent = d.nuevas;
      if(nb) nb.classList.remove('hidden');
      showToast(d.nuevas + ' respuesta(s) nueva(s) de leads', 'ok');
    }
  } catch(e) { console.log('Gmail sync error:', e.message); }
}

function checkGmailCallback() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('gmail_connected') === '1') {
    showToast('✅ Gmail conectado correctamente', 'ok');
    const b = document.getElementById('gmail-badge');
    if(b){ b.textContent = '● Gmail: conectado'; b.style.color = '#4ade80'; }
    window.history.replaceState({}, '', '/');
    syncGmail();
  }
  if (params.get('gmail_error')) {
    showToast('❌ Error conectando Gmail: ' + params.get('gmail_error'), 'err');
    window.history.replaceState({}, '', '/');
  }
}

function tipoBadge(tipo) {
  const map = {
    despachante:'badge-blue',estudio_aduanero:'badge-purple',
    operador_logistico:'badge-amber',importador_exportador:'badge-green',
    agro_industrial:'badge-green',empresa:'badge-gray'
  };
  return '<span class="badge ' + (map[tipo]||'badge-gray') + '">' + (tipo||'').replace(/_/g,' ') + '</span>';
}

function estadoBadge(estado) {
  const map = {
    sin_contactar:'badge-gray',contactado:'badge-blue',interesado:'badge-green',
    reunion_agendada:'badge-purple',no_interesado:'badge-red',sin_respuesta:'badge-amber',
    enviado:'badge-blue',respondido:'badge-green',rebotado:'badge-red',abierto:'badge-amber'
  };
  return '<span class="badge ' + (map[estado]||'badge-gray') + '">' + (estado||'').replace(/_/g,' ') + '</span>';
}

function formatFecha(iso) {
  if (!iso) return 'â€”';
  return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function showToast(msg, type) {
  type = type || 'ok';
  const toast = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.textContent = msg;
  toast.appendChild(el);
  setTimeout(function(){ el.remove(); }, 5000);
}
